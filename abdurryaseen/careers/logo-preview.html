<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AO Heritage — Logo Final</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f6f5f3; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; gap: 40px; }
    h1 { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; color: #999; }
    .preview { border-radius: 16px; padding: 60px 80px; text-align: center; width: 100%; max-width: 600px; }
    .light { background: #fff; border: 1px solid #e8e7e4; }
    .dark { background: #0c1a2e; }
    .pearl { background: #f6f5f3; border: 1px solid #e8e7e4; }
    .preview img { height: 100px; margin: 0 auto; }
    .label { font-size: 11px; color: #999; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
  </style>
</head>
<body>
  <h1>AO Heritage — Final Logo</h1>

  <div class="preview light">
    <p class="label">On White</p>
    <img src="logo-final.svg" alt="AO Heritage Logo">
  </div>

  <div class="preview pearl">
    <p class="label">On Pearl (site background)</p>
    <img src="logo-final.svg" alt="AO Heritage Logo">
  </div>

  <div class="preview dark">
    <p class="label" style="color:#555;">On Dark</p>
    <img src="logo-final.svg" alt="AO Heritage Logo">
  </div>
</body>
</html>
